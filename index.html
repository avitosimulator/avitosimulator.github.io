<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перекуп-симулятор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: маркетплейс — липкая шапка, лента карточек + правая колонка с ценами и новостями рынка */
:root{
  --bg:#ffffff; --surface:#f2f1f0; --surface2:#f8f8f7; --line:#e4e3e1;
  --fg:#1b1b1b; --muted:#767574;
  --blue:#0099f7; --blue-h:#0086d9; --blue-soft:#e3f3ff; --on:#ffffff;
  --green:#00a854; --green-h:#00924a; --green-soft:#e0f6e9;
  --red:#e0303f; --red-soft:#fde8ea; --amber:#a86a00; --amber-soft:#fff2d4;
  --art:#2a2a2a; --artfill:#ffffff; --overlay:rgb(18 18 18 / .5); --shadow:0 10px 34px rgb(0 0 0 / .14);
  color-scheme:light;
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px 6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.04em;text-decoration:none;color:var(--fg);margin-right:auto}
.logo-img{height:32px;width:auto;display:block;border-radius:6px}
.logo small{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);align-self:flex-end;margin-bottom:4px}
.stats{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.stat{background:var(--surface);border-radius:12px;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.stat span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.stat b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.speed button{border:0;background:transparent;border-radius:9px;width:38px;display:grid;place-items:center;color:var(--muted)}
.speed button svg{width:18px;height:18px}
.speed button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.hd-search{display:flex;gap:12px;padding-block:6px 4px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--blue);border-radius:12px;padding:0 12px;height:44px;min-width:0;background:var(--bg)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;height:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 12px 12px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--blue)}
.cnt{background:var(--surface);color:var(--fg);border-radius:20px;font-size:12px;padding:1px 7px;font-weight:700}
.cnt.hot{background:var(--red);color:#fff}

/* buttons */
.btn{border:0;border-radius:12px;height:44px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s}
.btn.sm{height:36px;padding:0 14px;border-radius:10px;font-size:14px}
.btn.blue{background:var(--blue);color:var(--on)}.btn.blue:hover{background:var(--blue-h)}
.btn.green{background:var(--green);color:var(--on)}.btn.green:hover{background:var(--green-h)}
.btn.ghost{background:var(--surface);color:var(--fg)}.btn.ghost:hover{background:var(--line)}
.btn.soft{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

main{padding-block:20px 40px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* feed */
.feed-lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.feed-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{white-space:nowrap}
.chip{border:0;background:var(--surface);border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg)}
.sel{margin-left:auto;border:0;background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px 16px}
.card{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover .t{color:var(--blue)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;color:var(--art);display:grid;place-items:center;
  background:linear-gradient(140deg,hsl(var(--h) 80% 60% / .24),hsl(var(--h) 80% 60% / .06)),var(--surface)}
.ph svg{width:72%;height:auto}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph img.ok{opacity:1}
.badge{z-index:1}
.badge{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
.ct{display:flex;flex-direction:column;gap:3px;min-width:0}
.t{font-weight:500;font-size:15px;line-height:1.3;transition:color .15s}
.pr{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.m{font-size:13px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface2);border-radius:16px}

.side{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px}
.quotes{width:100%;border-collapse:collapse;font-size:14px}
.quotes td{padding:6px 0;border-bottom:1px solid var(--line)}
.quotes tr:last-child td{border-bottom:0}
.quotes td:nth-child(2),.quotes td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.news{display:flex;flex-direction:column;gap:10px;font-size:14px}
.news div{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tip p{margin:0 0 8px;font-size:14px}.tip p:last-child{margin:0}

/* rows (мои вещи / мои объявления) */
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:18px;padding:14px;border:1px solid var(--line);border-radius:16px;align-items:center}
.row .ph{border-radius:10px}
.row .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:200px}
.kv{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface);color:var(--muted)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.inline{display:flex;gap:8px}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:36px;padding:0 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--blue);outline:0}
.inp.lg{height:48px;font-size:18px;font-weight:700;border-radius:12px}

/* chats */
.chats{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.chat{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chat.closed{opacity:.6}
.chat-h{display:flex;gap:10px;align-items:center}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:var(--fg);background:hsl(var(--h) 70% 60% / .3)}
.thread{display:flex;flex-direction:column;gap:6px}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--blue-soft);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:2px}
.typing{color:var(--muted);font-size:13px;font-style:italic}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.md{background:var(--bg);border-radius:20px;width:100%;max-width:960px;box-shadow:var(--shadow);padding:24px;position:relative}
.md.narrow{max-width:520px}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.md-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:16px}
.md-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.bigpr{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strike{text-decoration:line-through;color:var(--muted);font-size:16px;font-weight:600;margin-left:8px}
.seller{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px}
.stars{color:var(--amber);letter-spacing:1px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:0}
.specs dt{color:var(--muted)}.specs dd{margin:0}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.mkt{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
.mkt svg{width:100%;height:60px;display:block;margin-top:6px}
.hint{font-size:14px;font-weight:700;margin-top:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
textarea.inp{height:90px;padding:10px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue)}

/* profile */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:16px 24px}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 14px;background:var(--surface2);letter-spacing:.02em}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px}
.log{display:flex;flex-direction:column;gap:8px;font-size:14px;max-height:420px;overflow-y:auto}
.log div{display:grid;grid-template-columns:48px 1fr;gap:8px}

.phset{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.phset-h{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.phset-h .ph{border-radius:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:72px;height:54px;border-radius:8px;overflow:hidden;background:var(--surface)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease-out}
.toast.good{background:var(--green);color:var(--on)}
.toast.bad{background:var(--red);color:#fff}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
footer{padding-block:20px 32px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0}

@media (max-width:900px){
  .feed-lay,.two{grid-template-columns:minmax(0,1fr)}
  .md-grid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  h1{font-size:22px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .pr{font-size:16px}.t{font-size:14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .chips::-webkit-scrollbar{display:none}
  .sel{margin-left:0}
  .row{grid-template-columns:88px minmax(0,1fr);gap:12px}
  .row .acts{grid-column:1/-1;min-width:0}
  .hd-search .btn{display:none}
  .chats{grid-template-columns:minmax(0,1fr)}
  .md{padding:18px;border-radius:16px}
  .ov{padding-top:12px}
  .logo{font-size:21px}
  .stat b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hd">
  <div class="wrap hd-top">
    <a class="logo" href="#" data-a="tab" data-v="feed" aria-label="Авито, на главную">
      <img class="logo-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTEAV61jD8Bl9fHC0cj6hYtiwJX5pHvXHwBZaG43ldjOHZLLNVCvdVDTDiU&amp;s=10" alt="Авито" onerror="this.hidden=true">
      <span>Авито</span> <small>симулятор перекупа</small>
    </a>
    <div class="stats">
      <div class="stat"><span>Кошелёк</span><b id="money"></b></div>
    </div>
  </div>
  <div class="wrap hd-search">
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Поиск по объявлениям" aria-label="Поиск"></label>
    <button class="btn ghost" data-a="photos">Фото товаров</button>
    <button class="btn blue" data-a="post">Разместить объявление</button>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Разделы"></nav>
</header>

<main class="wrap" id="main"></main>

<footer><div class="wrap"><span>Фанатский симулятор, не связан с Авито. Все объявления, люди и цены вымышленные. Прогресс сохраняется в этом браузере.</span><span style="display:flex;gap:16px"><button class="linkbtn" data-a="photos">Фото товаров</button><button class="linkbtn" data-a="reset">Начать заново</button></span></div></footer>

<div class="ov" id="ov" hidden><div class="md" id="md" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ===== каталог ===== */
// Каждая модель описывает свои варианты (память, цвет, год, пробег, площадь…).
// base — цена типичной комплектации в отличном состоянии; для недвижимости — цена за м².
// gen(ci) собирает конкретное объявление: точное название, характеристики и множитель цены.
const CATS={all:'Все',phones:'Телефоны',laptops:'Ноутбуки и планшеты',games:'Игры и приставки',pc:'Товары для компьютера',audio:'Аудио и гаджеты',auto:'Автомобили',realty:'Недвижимость',hobby:'Велосипеды и самокаты',wear:'Одежда и обувь'};
const CAT_W={phones:.2,laptops:.09,games:.12,pc:.16,audio:.1,auto:.12,realty:.08,hobby:.06,wear:.07};
const CONDS={
  item:[{n:'Новое',f:1.3},{n:'Отличное',f:1},{n:'Хорошее',f:.85},{n:'Удовлетворительное',f:.62},{n:'На запчасти',f:.28}],
  car:[{n:'Как новый',f:1.12},{n:'Отличное',f:1},{n:'Хорошее',f:.92},{n:'Требует вложений',f:.78},{n:'Битый, не на ходу',f:.5}],
  flat:[{n:'Дизайнерский ремонт',f:1.18},{n:'Хороший ремонт',f:1},{n:'Косметический ремонт',f:.92},{n:'Требует ремонта',f:.82},{n:'Убитая',f:.62}],
  garage:[{n:'Новый',f:1.2},{n:'Хорошее',f:1},{n:'Нормальное',f:.9},{n:'Требует ремонта',f:.75},{n:'Аварийное',f:.5}],
};
const condOf=(pid,ci)=>CONDS[P[pid].cond||'item'][ci];
const cn=(pid,ci)=>condOf(pid,ci).n;
const vp=a=>a[wpick(a.map(x=>x[2]??1))];          // вариант [название, множитель, вес]
const fmt1=n=>n.toFixed(1).replace('.',',').replace(',0','');
const kmFmt=n=>n.toLocaleString('ru-RU');
const CAR_COLORS=['белый','чёрный','серебристый','серый','синий','красный','коричневый','бежевый'];
const STREETS=['ул. Чистопольская','пр-т Ямашева','ул. Адоратского','ул. Декабристов','ул. Гвардейская','ул. Юлиуса Фучика','ул. Габдуллы Тукая','ул. Короленко','ул. Сибгата Хакима','ул. Академика Глушко','ул. Хусаина Мавлютова','ул. Восстания','ул. Серова','пр-т Победы','ул. Ершова','ул. Камалеева','ул. Маршала Чуйкова','ул. Батыршина','ул. Даурская','ул. Мусина'];
const GPU_NV=[['Palit',.97,3,'Dual'],['Palit',1,2,'JetStream'],['MSI',.98,3,'Ventus 2X'],['MSI',1.08,1,'Gaming X'],['ASUS',.99,2,'Dual'],['ASUS',1.08,1,'TUF Gaming'],['Gigabyte',.98,2,'Eagle'],['Gigabyte',1.04,1,'Gaming OC'],['Zotac',.96,2,'Twin Edge']];

const JUNK_ALL=J(['chart','graph','diagram','logo','screen[\\s_-]*shot','screenshot','icon','map\\b','infographic','poster','advert','render',
  'die\\b','dies\\b','chip','wafer','micro','macro','close[\\s_-]*up','closeup','pixel','x[\\s_-]*ray','teardown','disassembl','pcb','motherboard','logic[\\s_-]*board','@','polysilicon',

  try{return await (await fetch(`https://${host}/w/api.php?`+new URLSearchParams({format:'json',origin:'*',...params}))).json()}catch(e){return{}}
}
const II={prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'330'};
const toList=j=>Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0))

const cSearch=(q,n=40)=>mw('commons.wikimedia.org',{action:'query',generator:'search',gsrnamespace:'6',gsrsearch:q+' filetype:bitmap',gsrlimit:String(n),...II}).then(toList);
const cCat=c=>mw('commons.wikimedia.org',{action:'query',generator:'categorymembers',gcmtitle:'Category:'+c,gcmtype:'file',gcmlimit:'40',...II}).then(toList);
// объект Викиданных по точному названию + его главная картинка (P18)
async function wdItem(label){
  const j=await mw('www.wikidata.org',{action:'wbsearchentities',search:label,language:'en',limit:'7',type:'item'});
  const hit=(j.search||[]).find(r=>(r.label||'').toLowerCase()===label.toLowerCase());if(!hit)return null;
  const e=await mw('www.wikidata.org',{action:'wbgetentities',ids:hit.id,props:'claims'});
  const cl=(e.entities&&e.entities[hit.id]&&e.entities[hit.id].claims)||{};
  return{id:hit.id,p18:(cl.P18||[]).map(x=>x.mainsnak&&x.mainsnak.datavalue&&x.mainsnak.datavalue.value).filter(Boolean)};
}
async function loadAuto(onProduct){
  try{const c=JSON.parse(localStorage.getItem(AUTO_KEY));if(c&&Date.now()-c.t<7*864e5){AUTOIMG=c.d;rebuild();return'cache'}}catch(e){}
  let got=0;const queue=[...PIDS];
  async function worker(){
    while(queue.length){
      const p=queue.shift(),a=AUTO[p],set=new Set();
      const clean=x=>!JUNK_ALL.test(x.title)&&!(a.kind==='item'&&JUNK_ITEM.test(x.title))&&!(a.kind==='car'&&JUNK_CAR.test(x.title));
      // 1) фото, где на Викискладе отмечено «изображает: <товар>» + главное фото статьи
      for(const label of a.wd){
        const it=await wdItem(label);if(!it)continue;
        for(const f of it.p18)if(/\.jpe?g$/i.test(f)&&clean({title:f}))set.add(filePath(f));
        for(const x of await cSearch('haswbstatement:P180='+it.id))if(clean(x))set.add(x.u);
        if(set.size>=20)break;
      }
      // 2) тематическая категория
      if(set.size<12)for(const c of a.cats)for(const x of await cCat(c))if(clean(x))set.add(x.u);
      // 3) поиск по названию файла, модель обязательна
      if(set.size<8)for(const x of await cSearch(`intitle:"${a.q.split(' ').slice(0,3).join(' ')}"`))if(clean(x)&&(!a.must||a.must.test(x.t)))set.add(x.u);
      // 4) видеокарты: добираем из той же серии
      if(a.fam&&set.size<8)for(const q of a.fq){for(const x of await cSearch(q))if(clean(x)&&(a.must.test(x.t)||a.fam.test(x.t)))set.add(x.u);if(set.size>=12)break}
      AUTOIMG[p]=[...set].slice(0,40);got+=AUTOIMG[p].length;rebuild();
      onProduct&&onProduct(p);
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(got)try{localStorage.setItem(AUTO_KEY,JSON.stringify({t:Date.now(),d:AUTOIMG}))}catch(e){}
  return got;
}
function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{

  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

function freeImg(pid,skip){
  const n=(IMG[pid]||[]).length;if(!n)return ri(0,999);
  const used=new Set();
  const all=[...S.feed,...S.inv,...S.listings.map(L=>L.item)];
  for(const x of all)if(x!==skip&&x.pid===pid&&x.img!=null)used.add(x.img%n);
  const free=[];for(let i=0;i<n;i++)if(!used.has(i))free.push(i);
  return free.length?pick(free):ri(0,n-1);
}

    case'jacket':g=`<path d="M58 14l22 10 22-10 30 16 10 46-18 4v30H54V80l-18-4 10-46z" ${f} ${s}/><path d="M80 24v86" ${s}/><path d="M56 46h48M56 64h48M56 82h48" ${s} opacity=".4"/><path d="M58 14l22 10 22-10-4 10-18 8-18-8z" fill="${acc}"/>`;break;
    case'parking':g=`<rect x="24" y="16" width="112" height="90" rx="6" ${f} ${s}/><path d="M66 32v58M66 32h20a15 15 0 0 1 0 30H66" fill="none" stroke="${acc}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;break;
    case'shoe':g=`<path d="M20 84c0-12 8-18 18-20l20-4c8-12 16-20 24-22 4 6 10 9 16 9l14 18c20 3 30 8 32 14 2 5-1 9-6 9H26c-4 0-6-2-6-4z" ${f} ${s}/><path d="M22 94h116" ${s}/><path d="M70 50l10 10M78 44l10 10" ${s} opacity=".5"/><path d="M96 72c10 2 18 4 26 8" stroke="${acc}" stroke-width="6" stroke-linecap="round" fill="none"/>`;break;
  }
  return`<svg viewBox="0 0 160 120" aria-hidden="true">${g}</svg>`;
}
const ph=(pid,extra='',n=0)=>`<div class="ph" style="--h:${P[pid].hue}">${art(pid)}${photo(pid,n)}${extra}</div>`;

/* ===== состояние ===== */
let S;
const UI={tab:'feed',cat:'all',q:'',sort:'date',modal:null,resetAsk:false};

function newState(){
  S={v:3,money:15000,market:{},feed:[],inv:[],listings:[],chats:[],deals:[],log:[],seq:1,
     stats:{sold:0,bought:0,profit:0,fees:0},rating:{sum:0,n:0}};
  for(const p of PIDS)S.market[p]=clamp(1+gauss()*.06,.88,1.12);
  for(let i=0;i<26;i++)S.feed.push(genFeed(now()-ri(0,180)*60000));
  logE('Начал карьеру перекупа с 15 000 ₽');
}
function genFeed(at){
  const pid=PIDS[wpick(PW)],m0=P[pid],grp=m0.cond||'item',shop=rnd()<.12;
  const ci=shop?wpick([.25,.55,.2,0,0]):wpick([.07,.3,.36,.2,.07]);
  const spec=m0.gen(ci),m=mpx({pid,ci,spec}),roll=rnd();
  const ratio=shop?rf(1.02,1.15):roll<.18?rf(.6,.84):roll<.88?clamp(1+gauss()*.07,.86,1.15):rf(1.12,1.35);
  const price=r100(m*ratio),newbie=!shop&&rnd()<.15;
  const seller=shop?{name:pick(SHOPS[grp==='item'?'item':grp==='car'?'car':'realty']),shop:true,rating:+rf(4.6,5).toFixed(1),n:ri(200,3000),since:ri(2012,2022)}
    :{name:pick(NAMES),rating:newbie?0:+clamp(rf(3.5,5.1),3.5,5).toFixed(1),n:newbie?0:ri(2,180),since:ri(2014,2025)};
  const urgent=!shop&&ratio<.84&&rnd()<.6;
  const dp=.06+(newbie?.18:seller.rating<4.3?.15:seller.rating<4.7?.05:0)+(ratio<.75?.22:ratio<.85?.08:0);
  const defect=!shop&&ci<4&&rnd()<dp?pick(DEFS[m0.fam]):null;
  const tail=shop?pick(['Гарантия 14 дней.','Трейд-ин и рассрочка.','Проверка при покупке.']):urgent?'Срочно, переезд, отдам быстро.':pick(['Торг уместен.','Без торга.','Обмен не интересует.','Пишите в чат, звонки не принимаю.']);
  let flex=shop?.97:urgent?rf(.74,.86):rf(.84,.96);if(tail==='Без торга.')flex=Math.min(.99,flex+.05);
  return{id:S.seq++,img:freeImg(pid),pid,ci,spec,price,at,seller,loc:pick(LOCS),
    desc:PRE[grp][ci]+spec.desc+' '+tail,urgent,defect,flex,tries:0,agreed:null,blocked:false,talk:[]};
}
function logE(t){S.log.unshift({ts:now(),t});S.log=S.log.slice(0,80)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&(d.v===2||d.v===3)){S=d;
  for(const p of PIDS)if(S.market[p]==null)S.market[p]=clamp(1+gauss()*.06,.88,1.12);
  S.inv=S.inv.filter(x=>P[x.pid]);S.listings=S.listings.filter(L=>P[L.item.pid]);
  if(S.v===2){S.feed=[];while(S.feed.length<26)S.feed.push(genFeed(now()-ri(0,180)*60000))}
  for(const x of [...S.feed,...S.inv,...S.listings.map(L=>L.item)])if(!x.spec)x.spec=P[x.pid].gen(x.ci);
  S.v=3;return true}}catch(e){}return false}

/* ===== рынок живёт в фоне ===== */
function repF(){const n=S.rating.n;if(!n)return .85;return clamp(.7+(S.rating.sum/n-3.5)*.25+Math.min(n,20)*.01,.6,1.3)}
function tick(){
  const openId=UI.modal&&UI.modal.t==='feed'?UI.modal.id:-1;
  S.feed=S.feed.filter(l=>{if(l.id===openId)return true;const r=l.price/mpx(l);return rnd()>.006+Math.max(0,.9-r)*.15});
  let n=poisson(.4);while(n-->0&&S.feed.length<40)S.feed.push(genFeed(now()));
  for(const L of S.listings){
    const m=mpx(L.item),att=clamp(Math.pow(m/L.price,3),.03,5),b=L.boost>now()?2.5:1;
    const v=poisson(1.2*att*b+.2);L.views+=v;if(v&&rnd()<.1*att)L.favs++;
    if(rnd()<.045*att*b*repF())newBuyer(L,m);
  }
  S.chats=S.chats.slice(0,60);
  save();hdr();renderMain();
}
function refreshFeed(){
  const openId=UI.modal&&UI.modal.t==='feed'?UI.modal.id:-1;
  S.feed=S.feed.filter(l=>l.id===openId||rnd()>.5);
  while(S.feed.length<24)S.feed.push(genFeed(now()-ri(0,30)*60000));
  save();renderMain(true);toast('Лента обновлена');
}
function newBuyer(L,m){
  const maxPay=r100(m*rf(.78,1.12));let type,offer;
  if(maxPay>=L.price){if(rnd()<.65){type='direct';offer=L.price}else{type='haggle';offer=r100(L.price*rf(.85,.95))}}
  else if(maxPay>=L.price*.8){type='haggle';offer=r100(Math.min(maxPay,L.price*rf(.78,.94)))}
  else{type='low';offer=r100(maxPay*rf(.7,.9))}
  offer=Math.min(offer,L.price);
  const name=pick(NAMES)+' '+pick('АБВГДЕЖЗИКЛМНОПРСТ'.split(''))+'.';
  S.chats.unshift({id:S.seq++,lid:L.id,pid:L.item.pid,title:ttl(L.item),name,hue:ri(0,359),maxPay,offer,status:'open',tries:0,unread:UI.tab!=='chat',
    msgs:[{me:0,t:pick((P[L.item.pid].cat==='realty'?BUY_MSG_R:P[L.item.pid].cat==='auto'?BUY_MSG_A:BUY_MSG)[type]).replace('{o}',money(offer))}]});
  if(UI.tab!=='chat')toast(`${name} по «${P[L.item.pid].short}»: ${type==='direct'?'берёт за вашу цену':'предлагает '+money(offer)}`);
}

/* ===== действия ===== */
function buy(id){
  const l=S.feed.find(x=>x.id===id);if(!l)return;const price=l.agreed??l.price;
  if(S.money<price){toast('Не хватает '+money(price-S.money),'bad');return}
  S.money-=price;S.feed=S.feed.filter(x=>x!==l);
  let ci=l.ci,note=null;if(l.defect){ci=Math.min(4,ci+l.defect.d);note=l.defect.t}
  S.inv.push({id:S.seq++,img:l.img??l.id,pid:l.pid,ci,spec:l.spec,buy:price,extra:0,note});
  S.stats.bought++;logE(`Купил ${ttl(l)} за ${money(price)}${note?' — '+note:''}`);
  closeModal();
  if(note)toast(`Дома выяснилось: ${note}. Состояние теперь «${cn(l.pid,ci)}»`,'bad',8000);
  else toast(`Куплено: ${ttl(l)} за ${money(price)}. Лежит в «Мои вещи»`,'good');
  save();hdr();renderMain();
}
function haggle(id){
  const l=S.feed.find(x=>x.id===id),inp=document.getElementById('hagIn');if(!l||!inp||l.blocked||l.typing)return;
  const offer=r100(+inp.value.replace(/\D/g,''));const cur=l.agreed??l.price;
  if(!offer){toast('Впишите сумму','bad');return}
  if(offer>=cur){toast('Предложение должно быть ниже текущей цены','bad');return}
  l.talk.push({me:1,t:`Здравствуйте! Отдадите за ${money(offer)}?`});l.tries++;
  const r=offer/l.price;let reply;
  if(r>=l.flex){l.agreed=offer;reply=pick(['Хорошо, давайте','Ладно, забирайте','Договорились,'])+` за ${money(offer)}.`}
  else if(r<.6){reply=pick(['Вы серьёзно? Нет.','Не смешите.','Пишите, когда будут адекватные предложения.']);l.blocked=true}
  else if(r>=l.flex-.1&&l.tries<3){const c=Math.min(cur,r100(l.price*(l.flex+(1-l.flex)*.35)));if(c<cur){l.agreed=c;reply=`За ${money(offer)} не могу. Давайте ${money(c)}, и по рукам.`}else{reply='Нет, дешевле не отдам.'}}
  else{reply=l.tries>=2?'Нет, это окончательная цена. Больше не пишите.':'Нет, дешевле не отдам.';if(l.tries>=2)l.blocked=true}
  l.typing=true;renderModal();
  setTimeout(()=>{l.typing=false;l.talk.push({me:0,t:reply});save();if(UI.modal&&UI.modal.id===id)renderModal()},900);
}
function publish(id){
  const it=S.inv.find(x=>x.id===id);if(!it)return;
  const price=r100(+document.getElementById('lp').value.replace(/\D/g,''));const boost=document.getElementById('lb').checked;
  if(!price){toast('Укажите цену','bad');return}
  if(boost&&S.money<199){toast('На продвижение не хватает денег','bad');return}
  if(boost){S.money-=199;it.extra+=199;S.stats.fees+=199}
  S.inv=S.inv.filter(x=>x!==it);
  S.listings.push({id:S.seq++,item:it,price,views:0,favs:0,boost:boost?now()+BOOST_MS:0});
  logE(`Выставил ${ttl(it)} за ${money(price)}`);
  closeModal();toast('Объявление опубликовано','good');UI.tab='my';save();hdr();renderMain();
}
function repair(id){
  const it=S.inv.find(x=>x.id===id);if(!it||!canRepair(it))return;const cost=repairCost(it);
  if(S.money<cost){toast('Не хватает на ремонт','bad');return}
  S.money-=cost;it.extra+=cost;it.ci--;it.note=null;logE(`Отремонтировал ${ttl(it)} за ${money(cost)}`);
  toast(`Ремонт готов: теперь «${cn(it.pid,it.ci)}»`,'good');save();hdr();renderMain();
}
const canRepair=it=>it.ci>=2&&!LEGAL.test(it.note||'')&&(it.ci<=3||['realty','auto'].includes(P[it.pid].cat));
const repairCost=it=>r100((mpx({...it,ci:it.ci-1})-mpx(it))*.7);
const pawnPrice=it=>r100(mpx(it)*.55);
const pawnName=it=>({realty:'Срочный выкуп',auto:'Автовыкуп'})[P[it.pid].cat]||'В скупку';
function pawn(id){
  const it=S.inv.find(x=>x.id===id);if(!it)return;const p=pawnPrice(it);
  S.money+=p;S.inv=S.inv.filter(x=>x!==it);recordDeal(it,p,'Скупка');
  toast(`Сдал в скупку за ${money(p)}`,'');save();hdr();renderMain();
}
function unpub(id){
  const L=S.listings.find(x=>x.id===id);if(!L)return;S.listings=S.listings.filter(x=>x!==L);S.inv.push(L.item);
  for(const c of S.chats)if(c.lid===id&&c.status==='open'){c.status='closed';c.msgs.push({sys:1,t:'Объявление снято с публикации'})}
  toast('Снято с публикации, вещь вернулась в «Мои вещи»');save();hdr();renderMain();
}
function boost(id){
  const L=S.listings.find(x=>x.id===id);if(!L)return;if(S.money<199){toast('Не хватает денег','bad');return}
  S.money-=199;L.item.extra+=199;S.stats.fees+=199;L.boost=Math.max(L.boost,now())+BOOST_MS;toast('Объявление поднято на 3 минуты','good');save();hdr();renderMain();
}
function setPrice(id){
  const L=S.listings.find(x=>x.id===id),el=document.getElementById('p-'+id);if(!L||!el)return;
  const v=r100(+el.value.replace(/\D/g,''));if(!v)return;L.price=v;toast('Цена обновлена: '+money(v));save();renderMain(true);
}
function recordDeal(it,price,who){
  const cost=it.buy+it.extra,profit=price-cost;
  S.deals.unshift({pid:it.pid,ci:it.ci,title:ttl(it),cost,sell:price,profit,who});S.deals=S.deals.slice(0,100);
  S.stats.sold++;S.stats.profit+=profit;logE(`Продал ${ttl(it)} за ${money(price)} (${profit>=0?'+':'−'}${money(Math.abs(profit))})`);
  return profit;
}
function complete(c,price){
  const L=S.listings.find(x=>x.id===c.lid);if(!L){c.status='closed';return}
  S.money+=price;S.listings=S.listings.filter(x=>x!==L);
  const profit=recordDeal(L.item,price,c.name);
  for(const o of S.chats)if(o.lid===L.id&&o!==c&&o.status==='open'){o.status='closed';o.msgs.push({sys:1,t:'Товар продан другому покупателю'})}
  c.status='done';c.msgs.push({sys:1,t:`Сделка: ${money(price)}`});
  const st=rnd()<.86?5:rnd()<.8?4:3;S.rating.sum+=st;S.rating.n++;
  toast(`Продано за ${money(price)}. ${profit>=0?'Прибыль':'Убыток'} ${money(Math.abs(profit))}. Отзыв: ${stars(st)}`,profit>=0?'good':'bad',6000);
}
function sell(id){const c=S.chats.find(x=>x.id===id);if(!c||c.status!=='open')return;c.msgs.push({me:1,t:`Хорошо, договорились за ${money(c.offer)}`});complete(c,c.offer);save();hdr();renderMain(true)}
function counter(id){
  const c=S.chats.find(x=>x.id===id),el=document.getElementById('c-'+id);if(!c||!el||c.status!=='open')return;
  const v=r100(+el.value.replace(/\D/g,''));if(!v)return;
  c.msgs.push({me:1,t:`Могу отдать за ${money(v)}`});
  if(v<=c.offer){c.msgs.push({me:0,t:'Отлично, беру!'});complete(c,v)}
  else if(v<=c.maxPay){c.msgs.push({me:0,t:pick(['Ок, договорились! Выезжаю.','Годится, беру за '+money(v)+'.'])});complete(c,v)}
  else if(c.tries<2){const no=r100(c.offer+(c.maxPay-c.offer)*rf(.5,.85));
    if(no<=c.offer){c.msgs.push({me:0,t:'Нет, это мой максимум. Удачи с продажей.'});c.status='closed'}
    else{c.offer=Math.min(no,v-100);c.tries++;c.msgs.push({me:0,t:pick(['Дороговато. Давайте {o}?','Максимум {o}, больше не могу.','{o} — и забираю сегодня.']).replace('{o}',money(c.offer))})}}
  else{c.msgs.push({me:0,t:pick(['Нет, спасибо, найду дешевле.','Не, дорого. Всего доброго.'])});c.status='closed'}
  save();hdr();renderMain(true);
}
function decline(id){const c=S.chats.find(x=>x.id===id);if(!c||c.status!=='open')return;c.msgs.push({me:1,t:'Извините, не готов.'});c.status='closed';save();hdr();renderMain(true)}

/* ===== отрисовка ===== */
const $=id=>document.getElementById(id);
function hdr(){
  $('money').textContent=money(S.money);
  const unread=S.chats.filter(c=>c.status==='open'&&c.unread).length,open=S.chats.filter(c=>c.status==='open').length;
  const tabs=[['feed','Объявления',''],['inv','Мои вещи',S.inv.length||''],['my','Мои объявления',S.listings.length||''],['chat','Сообщения',open||'',unread],['prof','Профиль','']];
  $('tabs').innerHTML=tabs.map(([k,n,c,u])=>`<button class="tab ${UI.tab===k?'on':''}" data-a="tab" data-v="${k}">${n}${c!==''?`<span class="cnt ${u?'hot':''}">${c}</span>`:''}</button>`).join('');
}
function busy(){const a=document.activeElement;return a&&a.matches('input,textarea,select')&&$('main').contains(a)}
function renderMain(force){
  if(!force&&busy())return;
  const v={feed:vFeed,inv:vInv,my:vMy,chat:vChat,prof:vProf}[UI.tab]();
  const main=$('main'),keep=new Map();
  main.querySelectorAll('img[data-k]').forEach(i=>{if(!keep.has(i.dataset.k))keep.set(i.dataset.k,i)});
  main.innerHTML=v;
  main.querySelectorAll('img[data-k]').forEach(i=>{const o=keep.get(i.dataset.k);if(o){i.replaceWith(o);keep.delete(i.dataset.k)}});
  if(UI.tab==='chat'){let ch=false;for(const c of S.chats)if(c.unread){c.unread=false;ch=true}if(ch){hdr();save()}}
}
function ratioBadge(price,m){const d=Math.round((price/m-1)*100);if(d<=-5)return`<span class="pill g">на ${-d}% ниже рынка</span>`;if(d>=5)return`<span class="pill r">на ${d}% выше рынка</span>`;return`<span class="pill">по рынку</span>`}

function vFeed(){
  const q=UI.q.trim().toLowerCase();

  list.sort(UI.sort==='cheap'?(a,b)=>a.price-b.price:UI.sort==='exp'?(a,b)=>b.price-a.price:(a,b)=>b.at-a.at);
  const cards=list.map(l=>`<button class="card" data-a="open" data-v="${l.id}">${ph(l.pid,l.urgent?'<span class="badge">СРОЧНО</span>':'',l.img??l.id)}
    <div class="ct"><div class="t">${esc(ttl(l))}</div><div class="pr">${money(l.price)}</div><div class="m">${cn(l.pid,l.ci)} · ${l.loc}</div><div class="m">${l.seller.shop?'Компания · ':''}${when(l.at)}</div></div></button>`).join('');
  const qp=[...new Set(list.map(l=>l.pid))].slice(0,14);

    <div class="toolbar"><select class="sel" id="sort" aria-label="Сортировка"><option value="date" ${UI.sort==='date'?'selected':''}>Сначала новые</option><option value="cheap" ${UI.sort==='cheap'?'selected':''}>Дешевле</option><option value="exp" ${UI.sort==='exp'?'selected':''}>Дороже</option></select>
      <button class="btn ghost sm" data-a="refresh">Обновить ленту</button></div>
    ${list.length?`<div class="grid">${cards}</div>`:'<div class="empty">Ничего не нашлось. Попробуйте другой запрос или подождите новых объявлений.</div>'}
  </section>
  <aside class="side">
    <section class="box"><h3>Цены на рынке</h3>${qp.length?`<table class="quotes"><tbody>${quotes}</tbody></table>`:'<p class="muted small" style="margin:0">Нет объявлений в этом разделе.</p>'}<p class="muted small" style="margin:8px 0 0">Типичная комплектация в отличном состоянии. Точная цена зависит от памяти, года, пробега, площади и этажа: смотрите в объявлении.</p></section>
    <section class="box tip"><h3>Как зарабатывать</h3><p>Ищите вещи ниже рынка, торгуйтесь, перепродавайте дороже.</p><p>Новые продавцы без отзывов и подозрительно дешёвые вещи чаще оказываются с сюрпризом.</p><p>Чем ниже цена вашего объявления относительно рынка, тем быстрее пишут покупатели.</p></section>
  </aside></div>`;
}
function vInv(){
  if(!S.inv.length)return`<h1>Мои вещи</h1><div class="empty" style="margin-top:16px">Здесь будут купленные вещи. Загляните в <button class="linkbtn" data-a="tab" data-v="feed">объявления</button> и найдите что-нибудь ниже рынка.</div>`;
  return`<h1>Мои вещи</h1><p class="muted">Купленное, но ещё не выставленное. Можно отремонтировать, выставить или быстро сдать в скупку.</p><div class="rows">${S.inv.map(it=>{
    const m=r100(mpx(it)),cost=it.buy+it.extra,pot=m-cost;
    return`<div class="row">${ph(it.pid,'',it.img??it.id)}<div style="min-width:0"><div class="t" style="font-weight:700">${esc(ttl(it))}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${it.ci>=3?'r':it.ci===2?'a':'g'}">${cn(it.pid,it.ci)}</span>${it.note?`<span class="pill r">${esc(it.note)}</span>`:''}</div>
      <div class="kv"><div><span>Вложено</span> <b>${money(cost)}</b></div><div><span>Рынок ≈</span> <b>${money(m)}</b></div><div><span>Потенциал</span> <b class="${pot>=0?'up':'down'}">${pot>=0?'+':'−'}${money(Math.abs(pot))}</b></div></div></div>
      <div class="acts"><button class="btn blue sm" data-a="list" data-v="${it.id}">Разместить объявление</button>
      ${canRepair(it)?`<button class="btn ghost sm" data-a="repair" data-v="${it.id}">Ремонт за ${money(repairCost(it))}</button>`:''}
      <button class="btn ghost sm" data-a="pawn" data-v="${it.id}">${pawnName(it)} за ${money(pawnPrice(it))}</button></div></div>`}).join('')}</div>`;
}
function vMy(){
  if(!S.listings.length)return`<h1>Мои объявления</h1><div class="empty" style="margin-top:16px">Активных объявлений нет. Выставьте вещь из раздела <button class="linkbtn" data-a="tab" data-v="inv">«Мои вещи»</button>.</div>`;
  return`<h1>Мои объявления</h1><p class="muted">Покупатели пишут в «Сообщения». Цену можно менять в любой момент.</p><div class="rows">${S.listings.map(L=>{
    const it=L.item,m=mpx(it),chats=S.chats.filter(c=>c.lid===L.id&&c.status==='open').length,boosted=L.boost>now();
    return`<div class="row">${ph(it.pid,'',it.img??it.id)}<div style="min-width:0"><div class="t" style="font-weight:700">${esc(ttl(it))}</div>
      <div class="pr" style="margin-top:4px">${money(L.price)}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${ratioBadge(L.price,m)}<span class="pill">${cn(it.pid,it.ci)}</span>${boosted?`<span class="pill b">Продвижение ещё ${Math.ceil((L.boost-now())/60000)} мин</span>`:''}</div>
      <div class="kv"><div><span>Просмотры</span> <b>${L.views}</b></div><div><span>В избранном</span> <b>${L.favs}</b></div><div><span>Чаты</span> <b>${chats}</b></div><div><span>Вложено</span> <b>${money(it.buy+it.extra)}</b></div><div><span>Рынок ≈</span> <b>${money(r100(m))}</b></div></div></div>
      <div class="acts"><div class="inline"><input class="inp" id="p-${L.id}" inputmode="numeric" value="${L.price}" aria-label="Новая цена"><button class="btn soft sm" data-a="setprice" data-v="${L.id}">Сохранить</button></div>
      <button class="btn ghost sm" data-a="boost" data-v="${L.id}">Поднять в поиске · 199 ₽</button>
      <button class="btn danger sm" data-a="unpub" data-v="${L.id}">Снять с публикации</button></div></div>`}).join('')}</div>`;
}
function vChat(){
  if(!S.chats.length)return`<h1>Сообщения</h1><div class="empty" style="margin-top:16px">Пока никто не писал. Выставите вещь, и покупатели появятся.</div>`;
  const list=[...S.chats].sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1));
  return`<h1>Сообщения</h1><p class="muted">Можно продать по предложению покупателя, назвать свою цену или отказать.</p><div class="chats">${list.map(c=>{
    const L=S.listings.find(x=>x.id===c.lid);
    const st=c.status==='open'?'<span class="pill a">ждёт ответа</span>':c.status==='done'?'<span class="pill g">продано</span>':'<span class="pill">закрыт</span>';
    return`<article class="chat ${c.status==='closed'?'closed':''}"><div class="chat-h"><div class="ava" style="--h:${c.hue}">${c.name[0]}</div><div style="min-width:0;flex:1"><b>${esc(c.name)}</b><div class="m">${esc(c.title||P[c.pid].short)}${L?' · ваша цена '+money(L.price):''}</div></div>${st}</div>
      <div class="thread">${c.msgs.slice(-6).map(m=>`<div class="bub ${m.sys?'sys':m.me?'me':''}">${esc(m.t)}</div>`).join('')}</div>
      ${c.status==='open'?`<button class="btn green sm" data-a="sell" data-v="${c.id}">Продать за ${money(c.offer)}</button>
      <div class="inline"><input class="inp" id="c-${c.id}" inputmode="numeric" placeholder="Своя цена" aria-label="Встречная цена" value="${L?L.price:''}"><button class="btn soft sm" data-a="counter" data-v="${c.id}">Предложить</button><button class="btn ghost sm" data-a="decline" data-v="${c.id}">Отказать</button></div>`:''}
    </article>`}).join('')}</div>`;
}
function vProf(){
  const r=S.rating.n?(S.rating.sum/S.rating.n):0;
  const deals=S.deals.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Товар</th><th>Кому</th><th class="r">Вложено</th><th class="r">Продано</th><th class="r">Итог</th></tr></thead><tbody>${S.deals.map(d=>`<tr><td>${esc(d.title||(P[d.pid]?P[d.pid].short:'—'))} <span class="muted small">· ${P[d.pid]?cn(d.pid,d.ci):''}</span></td><td>${esc(d.who)}</td><td class="r">${money(d.cost)}</td><td class="r">${money(d.sell)}</td><td class="r ${d.profit>=0?'up':'down'}">${d.profit>=0?'+':'−'}${money(Math.abs(d.profit))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Сделок пока нет.</div>';
  return`<h1>Профиль</h1>
  <div class="tiles"><div class="tile"><span>Кошелёк</span><b>${money(S.money)}</b></div><div class="tile"><span>Чистая прибыль</span><b class="${S.stats.profit>=0?'up':'down'}">${S.stats.profit>=0?'+':'−'}${money(Math.abs(S.stats.profit))}</b></div>
  <div class="tile"><span>Куплено / продано</span><b>${S.stats.bought} / ${S.stats.sold}</b></div><div class="tile"><span>Рейтинг продавца</span><b>${S.rating.n?r.toFixed(1)+' <span class="stars" style="font-size:16px">'+stars(r)+'</span>':'—'}</b><span>${S.rating.n?S.rating.n+' отзывов':'нет отзывов'}</span></div></div>
  <div class="two"><section style="min-width:0"><h3>Сделки</h3>${deals}</section><section class="box"><h3>Журнал</h3><div class="log">${S.log.map(e=>`<div><span class="muted small num">${e.ts?clockOf(e.ts):''}</span><span>${esc(e.t)}</span></div>`).join('')}</div></section></div>`;
}

/* ===== модалки ===== */
function renderModal(){
  const M=UI.modal,md=$('md');if(!M){$('ov').hidden=true;return}
  $('ov').hidden=false;md.className='md';md.style.maxWidth='';const x=`<button class="x" data-a="close" aria-label="Закрыть"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`;
  if(M.t==='feed'){
    const l=S.feed.find(o=>o.id===M.id);if(!l){closeModal();return}
    const m=mpx(l),cur=l.agreed??l.price,sel=l.seller,warns=[];
    if(sel.shop){}else if(!sel.n)warns.push('Новый продавец, отзывов нет');else if(sel.rating<4.3)warns.push('У продавца низкий рейтинг');
    if(l.price/m<.75)warns.push('Цена подозрительно низкая для такого состояния');
    md.innerHTML=x+`<h2 style="padding-right:44px">${esc(ttl(l))}</h2><div class="m" style="margin-top:4px">${l.loc} · ${when(l.at)} · №${100000+l.id*37}</div>
    <div class="md-grid"><div class="md-col">${ph(l.pid,l.urgent?'<span class="badge">СРОЧНО</span>':'',l.img??l.id)}
      <div><h3>Характеристики</h3><dl class="specs">${l.spec.params.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}<dt>Состояние</dt><dd>${cn(l.pid,l.ci)}</dd><dt>Категория</dt><dd>${CATS[P[l.pid].cat]}</dd><dt>Тип объявления</dt><dd>${sel.shop?'Товар приобретён на продажу':'Продаю своё'}</dd></dl></div>
      <div><h3>Описание</h3><p style="margin:0">${esc(l.desc)}</p></div></div>
    <div class="md-col">
      <div><div class="bigpr">${money(cur)}${l.agreed?`<span class="strike">${money(l.price)}</span>`:''}</div><div style="margin-top:6px">${ratioBadge(cur,m)}</div></div>
      <button class="btn blue wide" data-a="buy" data-v="${l.id}">Купить за ${money(cur)}</button>
      ${warns.map(w=>`<div class="warn"><span>!</span><span>${w}</span></div>`).join('')}
      <div class="mkt"><b>Рыночная цена ≈ ${money(r100(m))}</b><div class="muted small">для этой комплектации и состояния «${cn(l.pid,l.ci)}»</div></div>
      <div><h3>Торг</h3><div class="thread">${l.talk.map(t=>`<div class="bub ${t.me?'me':''}">${esc(t.t)}</div>`).join('')}${l.typing?'<div class="typing">Продавец печатает…</div>':''}</div>
        ${l.blocked?'<p class="muted small">Продавец больше не торгуется.</p>':`<div class="inline" style="margin-top:8px"><input class="inp" id="hagIn" inputmode="numeric" placeholder="Ваша цена, ₽" aria-label="Ваша цена" value="${r100(cur*.85)}"><button class="btn green sm" data-a="hag" data-v="${l.id}" ${l.typing?'disabled':''}>Предложить</button></div>`}</div>
      <div class="seller"><div class="ava" style="--h:${(sel.name.length*47)%360}">${sel.name[0]}</div><div><b>${esc(sel.name)}</b>${sel.shop?' <span class="pill b">Компания</span>':''}<div class="small">${sel.n?`<span class="stars">${stars(sel.rating)}</span> ${sel.rating} · ${sel.n} отзывов`:'<span class="muted">Нет отзывов</span>'}</div><div class="m">На Авито с ${sel.since} года</div></div></div>
    </div></div>`;
  }else if(M.t==='list'){
    const it=S.inv.find(o=>o.id===M.id);if(!it){closeModal();return}
    md.className='md narrow';const m=mpx(it);
    md.innerHTML=x+`<h2 style="padding-right:44px">Новое объявление</h2><div style="display:flex;flex-direction:column;gap:16px;margin-top:16px">
      <div style="display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center">${ph(it.pid,'',it.img??it.id)}<div style="min-width:0"><b>${esc(ttl(it))}</b><div class="m">${cn(it.pid,it.ci)} · вложено ${money(it.buy+it.extra)}</div></div></div>
      <div class="field"><label for="lp">Цена, ₽</label><input class="inp lg" id="lp" inputmode="numeric" value="${r100(m*1.02)}"><div class="muted small">Рыночная цена ≈ ${money(r100(m))}</div><div class="hint" id="lh"></div></div>
      <label class="check"><input type="checkbox" id="lb"><span><b>Продвижение на 3 минуты · 199 ₽</b><br><span class="muted">Объявление чаще показывается в ленте, просмотров примерно в 2,5 раза больше</span></span></label>
      <button class="btn blue wide" data-a="pub" data-v="${it.id}">Опубликовать</button></div>`;
    const upd=()=>{const v=+$('lp').value.replace(/\D/g,''),r=v/m,cost=it.buy+it.extra,pr=v-cost;
      const s=!v?['','Укажите цену']:r<=.9?['up','Улетит моментально']:r<=1.01?['up','Продастся быстро']:r<=1.1?['','Придётся подождать']:r<=1.25?['down','Долго, будут торговаться']:['down','Почти никто не купит'];
      $('lh').innerHTML=`<span class="${s[0]}">${s[1]}</span>${v?` · <span class="${pr>=0?'up':'down'}">${pr>=0?'прибыль':'убыток'} ${money(Math.abs(pr))}</span>`:''}`};
    $('lp').addEventListener('input',upd);upd();
  }else if(M.t==='photos'){
    md.className='md narrow';md.style.maxWidth='720px';md.innerHTML=x+vPhotos();
  }else if(M.t==='reset'){
    md.className='md narrow';
    md.innerHTML=x+`<h2 style="padding-right:44px">Начать заново?</h2><p class="muted">Деньги, вещи, объявления и сделки удалятся. Это нельзя отменить.</p><div class="inline" style="margin-top:16px"><button class="btn danger" data-a="resetYes">Удалить прогресс</button><button class="btn ghost" data-a="close">Отмена</button></div>`;
  }
}
function openModal(m){UI.modal=m;renderModal();document.body.style.overflow='hidden';setTimeout(()=>{const f=$('md').querySelector('#lp,.btn');f&&f.focus()},30)}
function closeModal(){UI.modal=null;$('ov').hidden=true;document.body.style.overflow=''}

/* ===== тосты ===== */
function toast(t,kind='',ms=4000){const d=document.createElement('div');d.className='toast '+kind;d.textContent=t;$('toasts').appendChild(d);
  const all=$('toasts').children;if(all.length>4)all[0].remove();setTimeout(()=>d.remove(),ms)}

/* ===== события ===== */
document.addEventListener('click',e=>{
  if(e.target===$('ov')){closeModal();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=+v;
  switch(a){
    case'tab':e.preventDefault();UI.tab=v;hdr();renderMain(true);window.scrollTo({top:0});break;
    case'cat':UI.cat=v;renderMain(true);break;
    case'refresh':refreshFeed();break;
    case'open':openModal({t:'feed',id});break;
    case'close':closeModal();break;
    case'buy':buy(id);break;
    case'hag':haggle(id);break;
    case'list':openModal({t:'list',id});break;
    case'pub':publish(id);break;
    case'repair':repair(id);break;
    case'pawn':pawn(id);break;
    case'unpub':unpub(id);break;
    case'boost':boost(id);break;
    case'setprice':setPrice(id);break;
    case'sell':sell(id);break;
    case'counter':counter(id);break;
    case'decline':decline(id);break;
    case'post':UI.tab='inv';hdr();renderMain(true);if(!S.inv.length)toast('Сначала купите что-нибудь в объявлениях');break;
    case'reset':openModal({t:'reset'});break;
    case'photos':openModal({t:'photos'});break;
    case'reauto':try{localStorage.removeItem(AUTO_KEY)}catch(err){}AUTOIMG={};rebuild();toast('Ищу фото заново…');startAuto();break;
    case'phurl':addUrls(v);break;
    case'phdel':{const[pp,ii]=v.split('|');delPhoto(pp,+ii);break}
    case'resetYes':closeModal();try{localStorage.removeItem(SAVE_KEY)}catch(err){}newState();UI.tab='feed';save();hdr();renderMain(true);toast('Новая игра. Удачи!','good');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&UI.modal)closeModal();
  if(e.key==='Enter'&&e.target.id==='hagIn'&&UI.modal)haggle(UI.modal.id);
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('c-'))counter(+e.target.id.slice(2));
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('p-'))setPrice(+e.target.id.slice(2));
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){UI.sort=e.target.value;renderMain(true)}
  if(e.target.dataset&&e.target.dataset.pid&&e.target.files){addFiles(e.target.dataset.pid,[...e.target.files]);e.target.value=''}});
$('q').addEventListener('input',e=>{UI.q=e.target.value;if(UI.tab!=='feed'){UI.tab='feed';hdr()}renderMain(true)});
$('main').addEventListener('focusout',()=>setTimeout(()=>{if(!busy())renderMain()},200));

/* ===== старт ===== */
loadPhotos();
if(!load())newState();
spreadImages();
function startAuto(){loadAuto(p=>{spreadImages(p);renderMain(true);if(UI.modal&&UI.modal.t==='photos')renderModal()}).then(r=>{if(r==='cache')spreadImages();save();renderMain(true);if(UI.modal)renderModal()})}
startAuto();
hdr();renderMain(true);setInterval(tick,TICK);

</script>
